    <style>

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen overflow-hidden select-none" style="padding-top: max(env(safe-area-inset-top), 24px); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);">
    <div id="root" class="h-full w-full flex flex-col"></div>
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        // Optionally dispatch a custom event that React can listen to
        window.dispatchEvent(new Event('pwa-install-available'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((error) => {
            console.log('SW registration failed:', error);
          });
        });
      }
    </script>
    <script type="module" src="index.tsx"></script>
</body>
